name: 'Continuous Deployment'

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      semantic:
        description: The SEMVER specification.
        required: true
        type: choice
        default: patch
        options:
          - 'major'
          - 'minor'
          - 'patch'

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./
        id: release
        with:
          ghToken: ${{ github.token }}
          semantic: ${{ inputs.semantic }}
          bumpNpm: true

      - name: Trigger sanity check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run sanity-check.yml \
            --ref "${{ github.ref_name }}" \
            -f tag="${{ steps.release.outputs.tag }}" \
            -f version="${{ steps.release.outputs.version }}" \
            -f released-refs='${{ steps.release.outputs.releasedRefs }}'
