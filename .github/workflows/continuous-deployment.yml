name: 'Continuous Deployment'

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      semantic:
        description: The SEMVER specification.
        required: true
        type: choice
        default: patch
        options:
          - 'major'
          - 'minor'
          - 'patch'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./
        id: release
        with:
          ghToken: ${{ github.token }}
          semantic: ${{ inputs.semantic }}
          bumpNpm: true

      - name: Verify release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tests/sanity/tag-release-checks.sh --tag "${{ steps.release.outputs.tag }}" --version "${{ steps.release.outputs.version }}" --released-refs '${{ steps.release.outputs.releasedRefs }}'
