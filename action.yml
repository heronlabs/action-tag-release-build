name: action-tag-release-build

author: Heron Labs

description: Tag and release based on semver spec input

branding:
  icon: tag
  color: blue

inputs:
  github-token:
    description: GitHub token for creating tags and releases
    required: true
  spec:
    description: Semver bump type (major, minor, patch)
    required: false
    default: 'patch'
  working-directory:
    description: Working directory (for monorepo sub-directories)
    required: false
    default: '.'
  create-release:
    description: Create a GitHub release after tagging
    required: false
    default: 'true'
  tag-prefix:
    description: Tag prefix for monorepo (e.g., my-package-v)
    required: false
    default: 'v'
  update-major-tag:
    description: Update major version tag (e.g., v1) to point to latest release
    required: false
    default: 'true'

outputs:
  version:
    description: The released version
    value: ${{ steps.release.outputs.version }}
  tag:
    description: The created tag
    value: ${{ steps.release.outputs.tag }}
  major-tag:
    description: The major version tag (e.g., v1)
    value: ${{ steps.update-major.outputs.major-tag }}
  minor-tag:
    description: The minor version tag (e.g., v1.0)
    value: ${{ steps.update-major.outputs.minor-tag }}

runs:
  using: composite
  steps:
    - name: 'Config git'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: 'Bump version'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm version "${{ inputs.spec }}" --no-git-tag-version

    - name: 'Commit and tag'
      id: release
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        VERSION=$(node -p "require('./package.json').version")
        TAG="${{ inputs.tag-prefix }}${VERSION}"
        
        git add package.json package-lock.json 2>/dev/null || git add package.json
        git commit -m "[skip ci] bump version"
        git pull --rebase origin ${{ github.ref_name }}
        git tag -a "$TAG" -m "Release ${VERSION}"
        git push --follow-tags
        
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        echo "✅ Tagged: $TAG"

    - name: 'Update major version tag'
      id: update-major
      if: inputs.update-major-tag == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        VERSION="${{ steps.release.outputs.version }}"
        PREFIX="${{ inputs.tag-prefix }}"
        
        # Extract major and minor versions
        MAJOR=$(echo "$VERSION" | cut -d. -f1)
        MINOR=$(echo "$VERSION" | cut -d. -f2)
        
        MAJOR_TAG="${PREFIX}${MAJOR}"
        MINOR_TAG="${PREFIX}${MAJOR}.${MINOR}"
        
        # Update major tag (e.g., v1) - force update to point to current commit
        git tag -fa "$MAJOR_TAG" -m "Latest ${MAJOR_TAG}.x.x release"
        
        # Update minor tag (e.g., v1.0) - force update to point to current commit
        git tag -fa "$MINOR_TAG" -m "Latest ${MINOR_TAG}.x release"
        
        # Force push the updated tags
        git push origin "$MAJOR_TAG" --force
        git push origin "$MINOR_TAG" --force
        
        echo "major-tag=$MAJOR_TAG" >> "$GITHUB_OUTPUT"
        echo "minor-tag=$MINOR_TAG" >> "$GITHUB_OUTPUT"
        echo "✅ Updated floating tags: $MAJOR_TAG -> $VERSION, $MINOR_TAG -> $VERSION"

    - name: 'Create release'
      if: inputs.create-release == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        gh release create "${{ steps.release.outputs.tag }}" \
          --title "${{ steps.release.outputs.tag }}" \
          --generate-notes
        echo "✅ Released: ${{ steps.release.outputs.tag }}"
