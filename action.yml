name: action-tag-release-build

author: Heron Labs

description: Tag and release based on semver spec input

branding:
  icon: tag
  color: blue

inputs:
  gh_token:
    description: GitHub token for creating tags
    required: true
  semantic:
    description: >-
      Semver bump type (major, minor, patch). When empty, the bump is inferred
      from the merge/HEAD commit using Conventional Commits, defaulting to patch
      when unclear.
    required: false
    default: ''
  working-directory:
    description: Working directory (for monorepo sub-directories)
    required: false
    default: '.'
  override_tag:
    description: Update major and minor version floating tags (e.g., v1, v1.0)
    required: false
    default: 'true'
  version_file:
    description: File to read/write version
    required: false
    default: 'version.txt'
  bump_npm:
    description: Also bump package.json version via npm version
    required: false
    default: 'false'
  bump_claude:
    description: Sync version into Claude Code plugin files (plugin.json + marketplace.json)
    required: false
    default: 'false'
  plugin_dir:
    description: Claude plugin directory
    required: false
    default: '.'

outputs:
  version:
    description: The released version
    value: ${{ steps.bump.outputs.version }}
  tag:
    description: The created tag (e.g., v1.2.3)
    value: ${{ steps.bump.outputs.tag }}
  tag_major:
    description: The major version tag (e.g., v1)
    value: ${{ steps.bump.outputs.tag_major }}
  tag_minor:
    description: The minor version tag (e.g., v1.0)
    value: ${{ steps.bump.outputs.tag_minor }}

runs:
  using: composite
  steps:
    - name: 'Bump, tag, and release'
      id: bump
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SEMANTIC: ${{ inputs.semantic }}
        VERSION_FILE: ${{ inputs.version_file }}
        REF_NAME: ${{ github.ref_name }}
        BUMP_NPM: ${{ inputs.bump_npm }}
        BUMP_CLAUDE: ${{ inputs.bump_claude }}
        PLUGIN_DIR: ${{ inputs.plugin_dir }}
        OVERRIDE_TAG: ${{ inputs.override_tag }}
        GH_TOKEN: ${{ inputs.gh_token }}
      run: bash ${{ github.action_path }}/core/entry-point.sh
