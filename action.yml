name: action-tag-release-build

author: Heron Labs

description: Tag and release based on semver spec input

branding:
  icon: tag
  color: blue

inputs:
  github-token:
    description: GitHub token for creating tags and releases
    required: true
  spec:
    description: >-
      Semver bump type (major, minor, patch). When empty, the bump is inferred
      from the merge/HEAD commit using Conventional Commits, defaulting to patch
      when unclear.
    required: false
    default: ''
  working-directory:
    description: Working directory (for monorepo sub-directories)
    required: false
    default: '.'
  create-release:
    description: Create a GitHub release after tagging
    required: false
    default: 'true'
  tag-prefix:
    description: Tag prefix for monorepo (e.g., my-package-v)
    required: false
    default: 'v'
  update-major-tag:
    description: Update major version tag (e.g., v1) to point to latest release
    required: false
    default: 'true'

outputs:
  version:
    description: The released version
    value: ${{ steps.release.outputs.version }}
  tag:
    description: The created tag
    value: ${{ steps.release.outputs.tag }}
  major-tag:
    description: The major version tag (e.g., v1)
    value: ${{ steps.update-major.outputs.major-tag }}
  minor-tag:
    description: The minor version tag (e.g., v1.0)
    value: ${{ steps.update-major.outputs.minor-tag }}

runs:
  using: composite
  steps:
    - name: 'Tag release'
      id: release
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SPEC: ${{ inputs.spec }}
        TAG_PREFIX: ${{ inputs.tag-prefix }}
        REF_NAME: ${{ github.ref_name }}
      run: bash ${{ github.action_path }}/core/tag-release.sh

    - name: 'Update major version tag'
      id: update-major
      if: inputs.update-major-tag == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        VERSION: ${{ steps.release.outputs.version }}
        TAG_PREFIX: ${{ inputs.tag-prefix }}
      run: bash ${{ github.action_path }}/core/update-major-tag.sh

    - name: 'Create release'
      if: inputs.create-release == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        TAG: ${{ steps.release.outputs.tag }}
      run: bash ${{ github.action_path }}/core/create-release.sh
