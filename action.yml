name: Tag Release Build

author: Heron Labs

description: Tag and release based on semver spec input

branding:
  icon: tag
  color: blue

inputs:
  ghToken:
    description: GitHub token for creating tags
    required: true
  semantic:
    description: Semver bump type (major, minor, patch)
    required: false
    default: ''
  workingDirectory:
    description: Working directory (for monorepo sub-directories)
    required: false
    default: '.'
  overrideTag:
    description: Update major and minor version floating tags (e.g., v1, v1.0)
    required: false
    default: 'true'
  tagPrefix:
    description: Tag prefix (e.g., v for v1.2.3)
    required: false
    default: 'v'
  versionFile:
    description: File to read/write version
    required: false
    default: 'version.txt'
  changelogFile:
    description: Changelog file path
    required: false
    default: 'CHANGELOG.md'
  bumpNpm:
    description: Also bump package.json version via npm version
    required: false
    default: 'false'
  bumpClaude:
    description: Sync version into Claude Code plugin files (plugin.json + marketplace.json)
    required: false
    default: 'false'
  pluginDir:
    description: Claude plugin directory
    required: false
    default: '.claude-plugin'
  target:
    description: Target branches to sync into, comma-separated (optional, future use)
    required: false
    default: ''

outputs:
  version:
    description: The released version
  tag:
    description: The created tag (e.g., v1.2.3)
  tagMajor:
    description: The major version tag (e.g., v1)
  tagMinor:
    description: The minor version tag (e.g., v1.0)

runs:
  using: node24
  main: bin/src/index.js
